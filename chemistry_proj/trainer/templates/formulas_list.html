{% extends "master.html" %}

{% block title %}
  Список формул
{% endblock %}

{% block content %}
  <div class="container-sm px-5 py-5">
    <a href="/" class="btn btn-outline-primary mb-4">
      <i class="bi bi-arrow-left"></i> На главную
    </a>
    
    <div class="row px-5 py-2">
      <h3 class="mb-4">Список сохраненных формул</h3>
    </div>
      
      <div class="row px-5 py-2">
        <div class="col-12">
          <div class="table-responsive">
            <table class="table table-hover table-bordered">
              <thead class="table-light">
                <tr>
                  <th style="width: 50%">Название</th>
                  <th style="width: 50%">Формула</th>
                </tr>
              </thead>
              <tbody>
                {% for x in chemformulas %}
                <tr>
                  <td>{{ x.name }}</td>
                  <td class="d-flex justify-content-between align-items-center">
                    <span class="formula">{{ x.formula|safe }}</span>
                    <form action="delete_formula" method="post" style="display: none;" class="delete-form">
                      {% csrf_token %}
                      <input type="hidden" name="formula_id" value="{{ x.id }}">
                      <button type="submit" class="btn btn-danger btn-xxs" onclick="return confirm('Вы уверены, что хотите удалить эту формулу?')">Удалить</button>
                    </form>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
  </div>

  <style>
    tr:hover .delete-form {
      display: block !important;
    }

    .btn-xxs {
      padding: 0.05rem 0.1rem;
      font-size: 0.6rem;
    }
  </style>
{% endblock %}
