{% extends "master.html" %}

{% block title %}
  Список формул
{% endblock %}

{% block content %}
  <div class="container-sm px-5 py-5">
    <a href="/" class="btn btn-outline-primary mb-4">
      <i class="bi bi-arrow-left"></i> На главную
    </a>
    
    <div class="row px-5 py-2">
      <h3 class="mb-4">Список сохраненных формул</h3>
    </div>
      
      <div class="row px-5 py-2">
        <div class="col-12">
          <div class="table-responsive">
            <table class="table table-hover table-bordered">
              <thead class="table-light">
                <tr>
                  <th style="width: 50%">Название</th>
                  <th style="width: 50%">Формула</th>
                </tr>
              </thead>
              <tbody>
                {% for x in chemformulas %}
                <tr>
                  <td>{{ x.name }}</td>
                  <td>{{ x.formula|safe }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
  </div>
{% endblock %}
